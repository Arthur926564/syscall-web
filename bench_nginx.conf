worker_processes 8;
error_log /tmp/bench_nginx_error.log warn;
pid /tmp/bench_nginx.pid;
daemon on;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;

    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js;
        application/octet-stream              bin;
    }
    default_type application/octet-stream;

    client_body_temp_path /tmp/bench_nginx_client_body;
    proxy_temp_path       /tmp/bench_nginx_proxy;
    fastcgi_temp_path     /tmp/bench_nginx_fastcgi;
    uwsgi_temp_path       /tmp/bench_nginx_uwsgi;
    scgi_temp_path        /tmp/bench_nginx_scgi;

    server {
        listen 127.0.0.1:8081 default_server reuseport;
        server_name localhost;
        root /home/arthur/projects/personalProject/syscall-web/www;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
